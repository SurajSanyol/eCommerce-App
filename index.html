<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="media.css" />
</head>

<body>

    <header>
        <div>
            <div class="container nav-container">
                <p class="logoName">Shop4u</p>
                <ul class="navList">
                    <li>Home</li>
                    <li>About</li>
                    <li>Contact</li>
                </ul>
                <div class="button-section">
                    <button class="button">Login</button>
                    
                    <a href="cartPage.html" id="cart-section"><i class="bi bi-cart"></i></a>

                    <script>
                         (async function getCartLength() {
                             let cartLength = JSON.parse(localStorage.getItem('cart')).length;

                             if(cartLength>0){
                                let cartLengthCount = document.createElement('span')
                                cartLengthCount.innerText = cartLength;
                                cartLengthCount.classList.add('cartCount')
                                 
                                document.getElementById('cart-section').appendChild(cartLengthCount);
                             }
                          })()
                    </script>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="productTtem">
            <div class="title">
                <h3>Product list</h3>
            </div>

            <div class="container">

                <div class="row card-container gx-3" id="card-container">

                </div>


                <script>
                    (async function getData() {
                        try {
                            
                            const data = await fetch('https://fakestoreapi.com/products');
                            const jsonData = await data.json();
                            console.log(jsonData);
                            if(jsonData){
                                showData(jsonData);
                            }
                        
                        } catch (error) {
                            console.error("Api fetching error", error);
                        }
                    })();

                    function showData(data) {
                        data.forEach((element) => {
                            let anchor = document.createElement("a");
                            let div = document.createElement("div");
                            let img = document.createElement("img");
                            let title = document.createElement("p");
                            let ratingPara = document.createElement("p");
                            let pricePara = document.createElement("p");

                            anchor.classList.add('card-link')
                            // anchor.target='_blank';
                            anchor.href=`cardPage.html?id=${element.id}`
                            anchor.classList.add('col-sm-4', 'col-md-3');

                            div.classList.add('cardItem');

                            img.classList.add("card-img");
                            img.src = element.image;

                            title.classList.add("product-title");
                            title.innerText=(element.title).substring(0,20)+'...';

                            ratingPara.classList.add("rating");
                            ratingPara.innerText = element.rating.rate+ '☆ '+'('+ element.rating.count +' ratings'+')';

                            pricePara.classList.add("price");
                            pricePara.innerText = '$'+element.price;

                            // appending
                            div.appendChild(img)
                            div.appendChild(title)
                            div.appendChild(ratingPara)
                            div.appendChild(pricePara)

                            anchor.appendChild(div);

                            document.querySelector('#card-container').appendChild(anchor)
                        });
                    }
                </script>


            </div>
        </div>
    </main>
</body>
<script src="index.js"></script>

</html>
